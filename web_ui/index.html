<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirrortime Pro Monitor</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <!-- Apache ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>

    <style>
        :root {
            /* Palette: Dark Professional (WandB / Linear inspired) */
            --bg-app: #0d0e12;
            --bg-panel: #16181d;
            --border-color: #2b2d35;
            --text-main: #e2e2e2;
            --text-muted: #8b8e98;

            --accent-primary: #5e6ad2;
            /* Indigo/Blur */
            --accent-success: #22c55e;
            --accent-warn: #eab308;
            --accent-err: #ef4444;
            --accent-info: #0ea5e9;

            --font-ui: 'Inter', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            overflow: hidden;
            /* Fix layout */
            display: flex;
            flex-direction: column;
        }

        /* --- Header --- */
        .app-header {
            height: 48px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .brand {
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand span {
            color: var(--accent-primary);
        }

        .header-meta {
            display: flex;
            gap: 24px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border-color);
            display: inline-block;
        }

        .status-dot.online {
            background: var(--accent-success);
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.4);
        }

        /* --- Main Layout --- */
        .dashboard-container {
            flex: 1;
            padding: 20px;
            display: grid;
            grid-template-rows: auto 1fr 1fr;
            /* KPI / Main / Bottom */
            gap: 20px;
            overflow-y: auto;
            /* Allow scroll if needed on small screens, though we aim for fit */
            height: calc(100vh - 48px);
        }

        /* --- KPI Row --- */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
        }

        .kpi-card {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100px;
        }

        .kpi-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .kpi-value {
            font-family: var(--font-mono);
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .kpi-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: auto;
        }

        /* --- Chart Panels --- */
        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
        }

        .panel-body {
            flex: 1;
            position: relative;
            min-height: 0;
            /* Important for flex/grid nesting */
        }

        .chart-instance {
            width: 100%;
            height: 100%;
        }

        /* --- Grid Areas --- */
        .main-chart-row {
            min-height: 350px;
        }

        .bottom-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            min-height: 300px;
        }
    </style>
</head>

<body>

    <header class="app-header">
        <div class="brand">MIRROR<span>TIME</span></div>
        <div class="header-meta">
            <div style="display:flex; align-items:center; gap:8px;">
                <span class="status-dot" id="online-ind"></span>
                <span id="cnn-text">CONNECTING</span>
            </div>
            <div><span style="color:var(--text-muted);">UPTIME:</span> <span id="uptime-val"
                    style="color:var(--text-main);">00:00:00</span></div>
        </div>
    </header>

    <div class="dashboard-container">
        <!-- KPI Row -->
        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-label">Iteration</div>
                <div class="kpi-value" id="kpi-iter">0</div>
                <div class="kpi-sub" id="kpi-progress">Target: 30,000</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">L1 Loss</div>
                <div class="kpi-value" id="kpi-loss" style="color: var(--accent-warn);">0.0000</div>
                <div class="kpi-sub">Current Batch</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">PSNR</div>
                <div class="kpi-value" id="kpi-psnr" style="color: var(--accent-success);">0.00</div>
                <div class="kpi-sub">Reconstruction Quality</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">Total Points</div>
                <div class="kpi-value" id="kpi-points">0</div>
                <div class="kpi-sub">Active Gaussians</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">System Load</div>
                <div class="kpi-value" id="kpi-gpu">0<span style="font-size:1rem;color:var(--text-muted);">MB</span>
                </div>
                <div class="kpi-sub">RAM: <span id="kpi-ram">0%</span></div>
            </div>
        </div>

        <!-- Main Chart: Dynamics -->
        <div class="panel main-chart-row">
            <div class="panel-header">
                <span>Training Dynamics</span>
                <span style="font-size:0.75rem; color:var(--text-muted);">Loss vs PSNR</span>
            </div>
            <div class="panel-body">
                <div id="chart-dynamics" class="chart-instance"></div>
            </div>
        </div>

        <!-- Bottom Grid -->
        <div class="bottom-grid">
            <!-- Model Stats -->
            <div class="panel">
                <div class="panel-header">Model Evolution</div>
                <div class="panel-body">
                    <div id="chart-model" class="chart-instance"></div>
                </div>
            </div>
            <!-- Lifetime -->
            <div class="panel">
                <div class="panel-header">Lifetime Distribution</div>
                <div class="panel-body">
                    <div id="chart-life" class="chart-instance"></div>
                </div>
            </div>
            <!-- System/Resources -->
            <div class="panel">
                <div class="panel-header">System Health</div>
                <div class="panel-body">
                    <div id="chart-system" class="chart-instance"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Setup ECharts Theme ---
        const themeColor = {
            bg: 'transparent',
            text: '#8b8e98',
            grid: '#2b2d35',
            tooltipBg: '#1b1d22',
            tooltipBorder: '#2b2d35'
        };

        // --- Init Charts ---
        const chartDyn = echarts.init(document.getElementById('chart-dynamics'));
        const chartModel = echarts.init(document.getElementById('chart-model'));
        const chartLife = echarts.init(document.getElementById('chart-life'));
        const chartSys = echarts.init(document.getElementById('chart-system'));

        // Common Config
        const commonGrid = { left: 50, right: 50, top: 30, bottom: 30, containLabel: true };
        const commonTooltip = {
            trigger: 'axis',
            backgroundColor: themeColor.tooltipBg,
            borderColor: themeColor.tooltipBorder,
            textStyle: { color: '#e2e2e2' },
            axisPointer: { type: 'cross', label: { backgroundColor: '#5e6ad2' } }
        };

        // 1. Dynamics Chart Setup
        chartDyn.setOption({
            backgroundColor: themeColor.bg,
            tooltip: commonTooltip,
            legend: { top: 5, textStyle: { color: themeColor.text } },
            grid: { ...commonGrid, bottom: 60 },
            dataZoom: [{ type: 'inside' }, { type: 'slider', bottom: 10, height: 20, borderColor: 'transparent', backgroundColor: '#16181d' }],
            xAxis: {
                type: 'value',
                axisLine: { lineStyle: { color: themeColor.grid } },
                axisLabel: { color: themeColor.text },
                splitLine: { show: false }
            },
            yAxis: [
                { type: 'value', name: 'Loss', position: 'left', splitLine: { lineStyle: { color: themeColor.grid, type: 'dashed' } }, axisLabel: { color: themeColor.text } },
                { type: 'value', name: 'PSNR', position: 'right', splitLine: { show: false }, axisLabel: { color: themeColor.text } }
            ],
            series: [
                { name: 'L1 Loss', type: 'line', showSymbol: false, smooth: true, lineStyle: { width: 2, color: '#eab308' }, areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: 'rgba(234,179,8,0.2)' }, { offset: 1, color: 'rgba(234,179,8,0)' }]) }, data: [] },
                { name: 'PSNR', type: 'line', yAxisIndex: 1, showSymbol: false, smooth: true, lineStyle: { width: 2, color: '#22c55e' }, data: [] }
            ]
        });

        // 2. Model Stats Setup (Points + Densification)
        chartModel.setOption({
            tooltip: commonTooltip,
            legend: { bottom: 0, textStyle: { fontSize: 10, color: themeColor.text } },
            grid: { left: 10, right: 10, top: 10, bottom: 30, containLabel: true },
            xAxis: { type: 'value', show: false }, // Sync with time conceptually but cleaner
            yAxis: [
                { type: 'value', name: 'Points', splitLine: { show: false } },
                { type: 'value', name: 'Events', position: 'right', splitLine: { show: false } } // For densification
            ],
            series: [
                { name: 'Points', type: 'line', showSymbol: false, lineStyle: { width: 2, color: '#a855f7' }, data: [] },
                { name: 'Cloned', type: 'bar', yAxisIndex: 1, itemStyle: { color: '#3b82f6' }, data: [] },
                { name: 'Pruned', type: 'bar', yAxisIndex: 1, itemStyle: { color: '#ef4444' }, data: [] }
            ]
        });

        // 3. Lifetime Setup
        chartLife.setOption({
            tooltip: { trigger: 'axis', backgroundColor: themeColor.tooltipBg },
            grid: { left: 10, right: 10, top: 10, bottom: 20, containLabel: true },
            xAxis: { type: 'category', axisLine: { show: false }, axisTick: { show: false }, axisLabel: { color: themeColor.text } },
            yAxis: { type: 'value', splitLine: { show: false }, axisLabel: { show: false } },
            series: [{ type: 'bar', itemStyle: { color: '#22c55e', borderRadius: [2, 2, 0, 0] }, data: [] }]
        });

        // 4. System Setup
        chartSys.setOption({
            tooltip: commonTooltip,
            legend: { top: 0, textStyle: { fontSize: 10, color: themeColor.text } },
            grid: { left: 10, right: 10, top: 25, bottom: 10, containLabel: true },
            xAxis: { type: 'category', show: false },
            yAxis: { type: 'value', min: 0, max: 100, splitLine: { show: false } }, // Normalize views
            series: [
                { name: 'RAM %', type: 'line', showSymbol: false, lineStyle: { width: 1.5, color: '#64748b' }, areaStyle: { color: 'rgba(100,116,139,0.1)' }, data: [] },
                { name: 'GPU % (Est)', type: 'line', showSymbol: false, lineStyle: { width: 1.5, color: '#0ea5e9' }, data: [] }
            ]
        });

        // --- Resize ---
        window.addEventListener('resize', () => {
            [chartDyn, chartModel, chartLife, chartSys].forEach(c => c.resize());
        });

        // --- Sync ---
        echarts.connect([chartDyn, chartModel, chartSys]);


        // --- Logic ---
        function updateUI() {
            fetch('/api/status')
                .then(r => r.json())
                .then(data => {
                    // Header Status
                    document.getElementById('online-ind').classList.add('online');
                    document.getElementById('cnn-text').innerText = "ONLINE";
                    document.getElementById('cnn-text').style.color = "var(--accent-success)";

                    // Time
                    const sec = Math.floor(data.elapsed_time);
                    const h = Math.floor(sec / 3600).toString().padStart(2, '0');
                    const m = Math.floor((sec % 3600) / 60).toString().padStart(2, '0');
                    const s = (sec % 60).toString().padStart(2, '0');
                    document.getElementById('uptime-val').innerText = `${h}:${m}:${s}`;

                    // KPIs
                    document.getElementById('kpi-iter').innerText = data.current_iteration.toLocaleString();
                    const total = data.total_iterations || 30000;
                    document.getElementById('kpi-progress').innerText = `Target: ${total.toLocaleString()} (${(data.current_iteration / total * 100).toFixed(1)}%)`;

                    if (data.loss_history.length) {
                        const last = data.loss_history[data.loss_history.length - 1];
                        document.getElementById('kpi-loss').innerText = last.y.toFixed(5);
                    }
                    if (data.psnr_history.length) {
                        const last = data.psnr_history[data.psnr_history.length - 1];
                        document.getElementById('kpi-psnr').innerText = last.y.toFixed(2);
                    }
                    if (data.point_count_history.length) {
                        const last = data.point_count_history[data.point_count_history.length - 1];
                        document.getElementById('kpi-points').innerText = last.y.toLocaleString();
                    }
                    if (data.memory_history.length) {
                        const last = data.memory_history[data.memory_history.length - 1];
                        document.getElementById('kpi-ram').innerText = last.system.toFixed(1) + "%";
                        document.getElementById('kpi-gpu').innerHTML = Math.round(last.gpu) + `<span style="font-size:1rem;color:var(--text-muted);">MB</span>`;
                    }

                    // --- Charts Data ---
                    const toArr = d => d.map(p => [p.x, p.y]);

                    // Dynamics
                    chartDyn.setOption({
                        series: [
                            { data: toArr(data.loss_history) },
                            { data: toArr(data.psnr_history) }
                        ]
                    });

                    // Model Stats (Points + Dens)
                    // We need to align X axis for dens bars if they are sparse. But here we just assume they align with Iter steps if recorded
                    chartModel.setOption({
                        series: [
                            { data: toArr(data.point_count_history) },
                            { data: toArr(data.clone_history) },
                            { data: toArr(data.pruned_history) }
                        ]
                    });

                    // Lifetime
                    if (data.lifetime_hist_labels) {
                        chartLife.setOption({
                            xAxis: { data: data.lifetime_hist_labels },
                            series: [{ data: data.lifetime_hist_counts }]
                        });
                    }

                    // System
                    if (data.memory_history.length) {
                        // Show last 100 points
                        const rec = data.memory_history.slice(-100);
                        // Flatten for index 0..N
                        const ram = rec.map((d, i) => [i, d.system]);
                        // Mock GPU % scale: assume 24GB max just for viz (or just show normalized trend)
                        // Or just show trend relative to 100% scale? We'll just divide MB by 240 (~24GB)
                        const gpu = rec.map((d, i) => [i, d.gpu / 240]);

                        chartSys.setOption({
                            series: [
                                { data: ram },
                                { data: gpu }
                            ]
                        });
                    }

                })
                .catch(e => {
                    document.getElementById('online-ind').classList.remove('online');
                    document.getElementById('cnn-text').innerText = "OFFLINE";
                    document.getElementById('cnn-text').style.color = "var(--text-muted)";
                });
        }

        setInterval(updateUI, 1000);

    </script>
</body>

</html>
